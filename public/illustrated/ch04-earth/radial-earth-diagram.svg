  <path d="M 400 370 C 450 350, 480 300, 520 280 C 560 260, 620 270, 680 230" stroke="#5B5751" stroke-width="0.75" stroke-linecap="round" opacity="0.35"/>
  <path d="M 400 430 C 350 450, 310 510, 270 540 C 230 570, 180 560, 120 600" stroke="#5B5751" stroke-width="0.75" stroke-linecap="round" opacity="0.35"/>
  <path d="M 370 400 C 340 460, 280 480, 250 530 C 220 580, 210 640, 160 700" stroke="#B75E3F" stroke-width="0.75" stroke-linecap="round" opacity="0.3"/>
